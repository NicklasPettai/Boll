appId: se.boll.game
productName: Boll
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
  icon: desktop/icon.ico
  # No signing key is configured. This also permits packaging on Linux without Wine.
  signAndEditExecutable: false
portable:
  artifactName: Boll-${version}-Windows-x64.exe
  unicode: true
